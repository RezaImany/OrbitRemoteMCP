[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit-remote-mcp"
version = "0.1.0"
description = "Streamable HTTP MCP server with secure session tokens and OpenWeather example tool."
readme = "README.md"
authors = [{ name = "Orbit Remote", email = "" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.28.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "mcp>=1.0.0",
  "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "anyio>=4.4.0",
]

[project.scripts]
orbit-remote-mcp = "orbit_remote_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_remote_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
