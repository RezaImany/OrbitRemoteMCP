version: "3.9"
services:
  orbit-remote-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/diagnostics/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
